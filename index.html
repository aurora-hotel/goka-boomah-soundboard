<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Goka Boomah Soundboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>💥 Goka Boomah Soundboard 💥</h1>

    <div id="controls" class="controls">
      <input id="filter" placeholder="Filter sounds..." aria-label="Filter sounds" />
      <button id="stopAll">🛑 Stop alles</button>
    </div>

    <div id="board" class="board" aria-live="polite"></div>

    <footer class="footer">
      <small>Bestanden uit de map <code>sounds/</code>. Voeg extra geluiden toe aan <code>sounds/</code> en run het script of update <code>sounds/list.json</code>.</small>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
